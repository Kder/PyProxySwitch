name: Tests

on:
  push:
    branches: [master, develop]
    paths:
      - 'pyproxyswitch/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'MANIFEST.in'
      - 'LICENSE'
      - 'README.md'
      - 'README_EN.txt'
      - 'RELEASING.md'
      - 'PyProxySwitch.py'
      - 'i18n/**'
      - 'tools/**'
      - 'releases.toml'
      - 'CHANGELOG.md'
      - 'htdocs'
      - '.gitmodules'
      - '.github/workflows/**'
  pull_request:
    branches: [master, develop]
    paths:
      - 'pyproxyswitch/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'MANIFEST.in'
      - 'LICENSE'
      - 'README.md'
      - 'README_EN.txt'
      - 'RELEASING.md'
      - 'PyProxySwitch.py'
      - 'i18n/**'
      - 'tools/**'
      - 'releases.toml'
      - 'CHANGELOG.md'
      - 'htdocs'
      - '.gitmodules'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve system Python 3.14
        id: python
        shell: bash
        run: |
          python_path="$(
            uv python find \
              --system \
              --no-managed-python \
              --no-python-downloads \
              --resolve-links 3.14
          )"
          test -n "$python_path"
          echo "python=$python_path" >> "$GITHUB_OUTPUT"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 libdbus-1-3

      - name: Verify generated release documentation
        run: |
          uv run \
            --python "${{ steps.python.outputs.python }}" \
            --no-project \
            python tools/sync_release_docs.py --check

      - name: Validate website
        run: |
          uv run \
            --python "${{ steps.python.outputs.python }}" \
            --no-project \
            python htdocs/tools/validate_site.py

      - name: Sync dependencies from uv.lock
        run: |
          uv sync --extra dev --python "${{ steps.python.outputs.python }}" --reinstall-package PyProxySwitch

      - name: Lint with Ruff
        run: |
          uv run --python "${{ steps.python.outputs.python }}" ruff check .

      - name: Verify generated UI modules
        run: |
          uv run --python "${{ steps.python.outputs.python }}" \
            python tools/generate_ui.py --check

      - name: Verify generated translations
        run: |
          uv run --python "${{ steps.python.outputs.python }}" \
            python tools/generate_i18n.py --check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve system Python 3.14
        id: python
        shell: bash
        run: |
          python_path="$(
            uv python find \
              --system \
              --no-managed-python \
              --no-python-downloads \
              --resolve-links 3.14
          )"
          test -n "$python_path"
          echo "python=$python_path" >> "$GITHUB_OUTPUT"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 libdbus-1-3

      - name: Sync dependencies from uv.lock
        run: |
          uv sync --extra dev --python "${{ steps.python.outputs.python }}" --reinstall-package PyProxySwitch

      - name: Type check with mypy
        run: |
          uv run --python "${{ steps.python.outputs.python }}" \
            mypy pyproxyswitch --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve system Python ${{ matrix.python-version }}
        id: python
        shell: bash
        run: |
          python_path="$(
            uv python find \
              --system \
              --no-managed-python \
              --no-python-downloads \
              --resolve-links ${{ matrix.python-version }}
          )"
          test -n "$python_path"
          echo "python=$python_path" >> "$GITHUB_OUTPUT"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 libdbus-1-3

      - name: Sync dependencies from uv.lock
        run: |
          uv sync --extra dev --python "${{ steps.python.outputs.python }}" --reinstall-package PyProxySwitch

      - name: Run tests
        shell: bash
        run: |
          uv run --python "${{ steps.python.outputs.python }}" \
            python -m pytest --cov=pyproxyswitch --cov-report=xml \
            --cov-report=term-missing --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
