# Canonical release metadata for generated changelogs and website pages.
# Keep releases newest-first. Dates are explicit TOML local dates; never derive
# them from the day on which the generator happens to run.

[[release]]
version = "4.0.4"
date = 2026-07-27
summary_zh = "强化原生代理协议处理和双语错误体系，并完善安全、可复现的发布自动化。"
summary_en = "Harden native proxy protocol handling and bilingual errors while completing safe, reproducible release automation."
changes_zh = [
    "严格校验 HTTP 请求与响应报文边界、分块编码、协议升级和 CONNECT 隧道，并补强超时、连接上限、目标策略与关闭流程。",
    "为代理校验与运行时错误引入稳定错误码和结构化参数，在 GUI 与 CLI 边界统一中英文展示。",
    "修复代理认证编辑和监听器重新配置的边界情况，并使 Nuitka 构建版本直接来源于 Git。",
    "自动编排发布准备与发布操作，校验制品和 GitHub Tests，并支持签名标签的安全重试与一致复用。",
    "新增标签触发的 GitHub Release 制品流程，收紧 CI 与 SourceForge 镜像配置，整理 Nuitka 构建依赖和维护文档。",
]
changes_en = [
    "Strictly validate HTTP request and response framing, chunked bodies, protocol upgrades, and CONNECT tunnels, and harden timeouts, connection limits, destination policy, and shutdown.",
    "Introduce stable error codes and structured parameters for validation and runtime proxy failures, with consistent bilingual rendering at the GUI and CLI boundaries.",
    "Fix edge cases in proxy authentication editing and listener reconfiguration, and derive Nuitka build versions directly from Git.",
    "Automate release preparation and publishing, validate artifacts and GitHub Tests, and support safe retries and consistent reuse of signed tags.",
    "Add tag-triggered GitHub Release artifacts, tighten CI and SourceForge mirroring, and organize Nuitka build dependencies and maintainer documentation.",
]

[[release]]
version = "4.0.3"
date = 2026-07-25
summary_zh = "完善网站子模块、发布文档和 Windows 可执行版国际化。"
summary_en = "Improve the website submodule, release documentation, and Windows executable localization."
changes_zh = [
    "将 htdocs 配置为独立网站子模块，并同步最新中英文使用文档。",
    "以 releases.toml 自动生成 CHANGELOG 和网站更新内容，并在 CI 中校验发布标签。",
    "修正项目仓库与问题反馈链接，将维护者发布流程移至 RELEASING.md。",
    "修复 Nuitka 的 Qt 翻译目录，使 exe 标准按钮正确显示中文。",
]
changes_en = [
    "Configure htdocs as an independent website submodule and synchronize the latest Chinese and English usage documentation.",
    "Generate the changelog and website updates from releases.toml and validate release tags in CI.",
    "Correct the repository and issue tracker links and move the maintainer release workflow to RELEASING.md.",
    "Fix Nuitka's Qt translation directory so standard buttons are localized in the executable.",
]

[[release]]
version = "4.0.2"
date = 2026-07-25
summary_zh = "完善版本和发布自动化。"
summary_en = "Improve version and release automation."
changes_zh = [
    "以 Git tag 作为唯一版本源，由 setuptools-scm 自动生成运行时版本。",
    "发布工作流在上传 PyPI 前校验 wheel 与 sdist 的版本元数据。",
    "规范 Nuitka 输出目录，dist 仅保留 wheel 和 sdist。",
    "修复 Python 3.14 下 Windows Proactor 关闭竞态。",
]
changes_en = [
    "Use Git tags as the sole version source and generate the runtime version with setuptools-scm.",
    "Validate wheel and sdist version metadata before publishing to PyPI.",
    "Standardize Nuitka output directories and reserve dist for wheels and sdists.",
    "Fix a Windows Proactor shutdown race on Python 3.14.",
]

[[release]]
version = "4.0.1"
date = 2026-07-18
summary_zh = "清理旧代理后端和二进制遗留，将配置与日志迁移到正确的用户目录，并补强代理生命周期边界。"
summary_en = "Remove legacy proxy backends and binaries, move configuration and logs to per-user directories, and harden proxy lifecycle boundaries."
changes_zh = [
    "清理旧版第三方二进制、后端配置生成器和过时测试。",
    "统一将 PPS.conf 与 proxy.txt 放入当前用户配置目录，日志使用当前用户日志目录。",
    "补强协议解析、认证校验、原子持久化、监听回退和连接半关闭处理。",
    "增加跨平台 UI 与翻译生成工具及 Python 3.11–3.14 CI。",
]
changes_en = [
    "Remove legacy third-party binaries, backend configuration generators, and obsolete tests.",
    "Store PPS.conf and proxy.txt in the current user's configuration directory and logs in the user log directory.",
    "Harden protocol parsing, authentication, atomic persistence, listener fallback, and half-close handling.",
    "Add cross-platform UI and translation generators and Python 3.11–3.14 CI.",
]

[[release]]
version = "4.0.0"
date = 2026-07-17
summary_zh = "使用 Python 标准库重写本地 HTTP/SOCKS 代理核心，实现无需重启监听器的上游热切换。"
summary_en = "Rewrite the local HTTP/SOCKS proxy core with the Python standard library and add upstream hot switching without listener restarts."
changes_zh = [
    "一个端口自动识别 HTTP、SOCKS4/SOCKS4a 与 SOCKS5 客户端。",
    "支持 HTTP、SOCKS4、SOCKS5 上游及 NoProxy 直连。",
    "支持 HTTP Basic 与 SOCKS5 用户名/密码认证。",
    "移除运行时对 3proxy、polipo 与 IP Relay 的依赖。",
]
changes_en = [
    "Detect HTTP, SOCKS4/SOCKS4a, and SOCKS5 clients on one local port.",
    "Support HTTP, SOCKS4, SOCKS5, and direct NoProxy upstream routing.",
    "Support HTTP Basic and SOCKS5 username/password authentication.",
    "Remove runtime dependencies on 3proxy, polipo, and IP Relay.",
]

